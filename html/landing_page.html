<!DOCTYPE html>
<html>
<head>
    <title>Is it a Shopify Store?</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #95BF47;
            --primary-hover: #7EA03C;
            --background: #ffffff;
            --text-color: #333333;
        }
        
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: var(--background);
            color: var(--text-color);
        }
        
        .container { 
            text-align: center; 
            padding: 2rem; 
            max-width: 500px; 
            width: 90%; 
        }
        
        .logo {
            width: 150px;
            margin-bottom: 1.5rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #666;
        }
        
        form { 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
            margin-top: 1rem;
            width: 100%;
        }
        
        input[type="url"] { 
            padding: 1rem; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            font-size: 1.1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        button { 
            padding: 1rem; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover { 
            background: var(--primary-hover); 
        }
        
        .error { 
            color: #e74c3c; 
            margin-top: 0.5rem; 
        }
        
        @media (min-width: 768px) {
            form {
                flex-direction: row;
            }
            
            input[type="url"] {
                flex: 1;
            }
            
            button {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/favicon.png" alt="Shopify Store Checker" class="logo">
        <h1>Is it a Shopify Store?</h1>
        <p>Enter a URL to check if it's a Shopify store</p>
        <form method="POST">
            <input type="url" name="url" placeholder="https://example.com" required>
            <button type="submit">Check</button>
        </form>
    </div>
</body>
</html>
