<!DOCTYPE html>
<html>
<head>
    <title>Is {{.Domain}} a Shopify Store?</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --shopify-green: #95BF47;
            --not-shopify-red: #e74c3c;
            --text-color: #ffffff;
        }
        
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            transition: background-color 0.5s ease;
        }
        
        .result-container {
            text-align: center;
            padding: 2rem;
        }
        
        .logo {
            width: 120px;
            margin-bottom: 2rem;
        }
        
        .result { 
            font-size: 5rem; 
            font-weight: 800; 
            margin-bottom: 1rem;
        }
        
        .domain {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .back-link {
            margin-top: 3rem;
            color: inherit;
            text-decoration: none;
            opacity: 0.7;
            font-size: 1.1rem;
            border: 2px solid currentColor;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            transition: opacity 0.3s;
        }
        
        .back-link:hover {
            opacity: 1;
        }
        
        .shopify {
            background: var(--shopify-green);
            color: var(--text-color);
        }
        
        .not-shopify {
            background: var(--not-shopify-red);
            color: var(--text-color);
        }
    </style>
</head>
<body class="{{if .IsShopify}}shopify{{else}}not-shopify{{end}}">
    <div class="result-container">
        <img src="/favicon.png" alt="Shopify Store Checker" class="logo">
        <div class="result">
            {{if .IsShopify}}YES{{else}}NO{{end}}
        </div>
        <div class="domain">{{.Domain}}</div>
        <a href="/" class="back-link">Check Another Site</a>
    </div>
</body>
</html>
